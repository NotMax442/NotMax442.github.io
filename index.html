<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz & Learning Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Quiz & Learning Portal</h1>
    </header>

    <section id="selection-panel" class="card">
      <h2>Select Academic Year & Subject</h2>
      
      <div class="form-group">
        <label for="year-select">Academic Year:</label>
        <select id="year-select">
          <option value="">-- Choose Year --</option>
          <option value="1">Year 1</option>
          <option value="2">Year 2</option>
          <option value="3">Year 3</option>
          <option value="4">Year 4</option>
          <option value="5">Year 5</option>
          <option value="6">Year 6</option>
        </select>
      </div>

      <div class="form-group">
        <label for="subject-select">Subject:</label>
        <select id="subject-select" disabled>
          <option value="">-- Select a Year First --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="mode-select">Mode:</label>
        <select id="mode-select">
          <option value="quiz">Test Mode (Score at end)</option>
          <option value="study">Study Mode (Instant answer & lesson)</option>
        </select>
      </div>

      <button id="start-btn" disabled>Start Session</button>
    </section>

    <section id="quiz-panel" class="card hidden">
      <div class="quiz-header">
        <span id="progress-text">Question 1 of 10</span>
      </div>

      <div class="question-container">
        <h3 id="question-text">Loading question...</h3>
        <div id="options-container" class="options-grid">
          </div>
      </div>

      <div id="lesson-box" class="lesson-box hidden">
        <h4>Lesson Explanation</h4>
        <p id="lesson-text"></p>
      </div>

      <div class="quiz-controls">
        <button id="submit-btn" class="hidden">Submit Answer</button>
        <button id="next-btn" class="hidden">Next Question</button>
      </div>
    </section>

    <section id="result-panel" class="card hidden">
      <h2>Session Complete!</h2>
      <p id="final-score"></p>
      <button id="restart-btn">Try Another Quiz</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
