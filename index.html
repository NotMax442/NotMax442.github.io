<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study & Quiz Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- Landing Screen -->
    <div id="landing-screen" class="screen">
      <h1>Medical Study Platform</h1>
      <p>Select your year, review saved missed questions, or test your knowledge.</p>
      <button id="enter-study-btn" class="btn primary-btn">🚀 Start Studying</button>
    </div>

    <!-- Year Selection Screen -->
    <div id="year-screen" class="screen hidden">
      <button class="btn back-btn">⬅️ Back</button>
      <h2>Select Academic Year</h2>
      <div class="year-grid">
        <div class="year-card" data-year="1">Year 1</div>
        <div class="year-card" data-year="2">Year 2</div>
        <div class="year-card" data-year="3">Year 3</div>
        <div class="year-card" data-year="4">Year 4</div>
        <div class="year-card" data-year="5">Year 5</div>
        <div class="year-card" data-year="6">Year 6</div>
      </div>
    </div>

    <!-- Subject Selection Screen -->
    <div id="subject-screen" class="screen hidden">
      <button class="btn back-btn">⬅️ Back to Years</button>
      <h2 id="selected-year-title">Subjects</h2>
      <div id="subject-list" class="subject-grid"></div>
    </div>

    <!-- Quiz / Study Screen -->
    <div id="quiz-screen" class="screen hidden">
      <div class="quiz-header">
        <button id="quit-session-btn" class="btn back-btn-warning">⬅️ Exit Session</button>
        <h2 id="session-info"></h2>
      </div>

      <div class="quiz-meta">
        <span id="progress-text"></span>
        <span id="timer-display" class="hidden">⏱️ 60:00</span>
      </div>

      <div class="question-box">
        <h3 id="question-text"></h3>
        <div id="options-container" class="options-grid"></div>
      </div>

      <button id="next-btn" class="btn primary-btn hidden">Next Question ➡️</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen hidden">
      <h2>Session Complete!</h2>
      <div class="score-card">
        <p id="final-score"></p>
        <div class="percentage-badge" id="score-percentage">0%</div>
        <div class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <div class="result-actions">
        <button id="retry-missed-btn" class="btn warning-btn hidden">
          🎯 Retry Missed Questions (<span id="missed-count">0</span>)
        </button>
        <button id="restart-btn" class="btn primary-btn">🔄 Return to Years</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
