<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question JSON Generator</title>
  <style>
    body { font-family: sans-serif; background: #121826; color: #fff; padding: 2rem; max-width: 700px; margin: auto; }
    input, textarea, select { width: 100%; padding: 10px; margin: 6px 0 16px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; }
    button { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-right: 10px; }
    .add-btn { background: #3b82f6; color: white; }
    .export-btn { background: #10b981; color: white; }
    .q-item { background: #1e293b; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <h2>Question JSON Generator</h2>

  <label>Question Text:</label>
  <textarea id="q-text" rows="2"></textarea>

  <label>Options (0 to 3):</label>
  <input type="text" id="opt-0" placeholder="Option 0 (Index 0)">
  <input type="text" id="opt-1" placeholder="Option 1 (Index 1)">
  <input type="text" id="opt-2" placeholder="Option 2 (Index 2)">
  <input type="text" id="opt-3" placeholder="Option 3 (Index 3)">

  <label>Correct Option Index:</label>
  <select id="correct-idx">
    <option value="0">Option 0</option>
    <option value="1">Option 1</option>
    <option value="2">Option 2</option>
    <option value="3">Option 3</option>
  </select>

  <label>Lesson / Explanation:</label>
  <textarea id="lesson-text" rows="2"></textarea>

  <button class="add-btn" onclick="addQuestion()">+ Add Question</button>
  <button class="export-btn" onclick="exportJSON()">📥 Download JSON File</button>

  <h3>Questions Added: <span id="count">0</span></h3>
  <div id="preview-list"></div>

  <script>
    let questionsList = [];

    function addQuestion() {
      const q = document.getElementById('q-text').value;
      const o0 = document.getElementById('opt-0').value;
      const o1 = document.getElementById('opt-1').value;
      const o2 = document.getElementById('opt-2').value;
      const o3 = document.getElementById('opt-3').value;
      const correctIndex = parseInt(document.getElementById('correct-idx').value);
      const lesson = document.getElementById('lesson-text').value;

      if (!q || !o0 || !o1) {
        alert("Please fill in at least the question and two options.");
        return;
      }

      const item = {
        id: questionsList.length + 1,
        question: q,
        options: [o0, o1, o2, o3].filter(opt => opt.trim() !== ""),
        correctIndex: correctIndex,
        lesson: lesson
      };

      questionsList.push(item);
      updateUI();
      clearForm();
    }

    function updateUI() {
      document.getElementById('count').textContent = questionsList.length;
      const list = document.getElementById('preview-list');
      list.innerHTML = questionsList.map((q, i) => `
        <div class="q-item">
          <span><strong>${i + 1}.</strong> ${q.question}</span>
          <button onclick="deleteQ(${i})" style="background:#ef4444; color:white; padding:4px 8px;">Delete</button>
        </div>
      `).join('');
    }

    function deleteQ(index) {
      questionsList.splice(index, 1);
      updateUI();
    }

    function clearForm() {
      document.getElementById('q-text').value = '';
      document.getElementById('opt-0').value = '';
      document.getElementById('opt-1').value = '';
      document.getElementById('opt-2').value = '';
      document.getElementById('opt-3').value = '';
      document.getElementById('lesson-text').value = '';
    }

    function exportJSON() {
      if (questionsList.length === 0) {
        alert("Add some questions first!");
        return;
      }

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ questions: questionsList }, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "questions.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
